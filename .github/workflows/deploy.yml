name: Publiceren

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Elke werkdag om 05:00 UTC verse testdata, zodat de data "vandaag" blijft.
    - cron: "0 5 * * 1-5"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verse testdata maken
        run: npm run data
      - name: Anonimiseringscheck
        run: npm run check:anon
      - name: Tests
        run: npm test
      - name: Bouwen
        run: npm run build
        env:
          VITE_AUTH_MODE: demo
          VITE_DATA_SOURCE: static
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
